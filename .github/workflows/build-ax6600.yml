name: Build AX6600 Firmware

on:
  push:
    branches:
      - main
    tags:
      - ax6600-*
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      source_key:
        description: "Key from targets/ax6600/upstreams.yml"
        required: false
        default: "source-primary"
      source_ref:
        description: "Exact branch, tag, or commit to build. Leave empty to use the configured branch."
        required: false
        default: ""
      optional_profiles:
        description: "Extra optional profiles to add"
        required: false
        default: ""
      replace_default_optional_profiles:
        description: "Ignore manifest default optional profiles"
        required: false
        type: boolean
        default: false
      package_overrides:
        description: "Whitespace/comma/newline separated package overrides. Use -pkg to disable."
        required: false
        default: ""
      publish_release:
        description: "Publish to GitHub Releases after a successful build"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag to create when publish_release is enabled"
        required: false
        default: ""
      release_name:
        description: "Release title. Leave empty to reuse the tag."
        required: false
        default: ""
      prerelease:
        description: "Mark the published release as a prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ax6600-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      INPUT_SOURCE_KEY: ${{ inputs.source_key || 'source-primary' }}
      INPUT_SOURCE_REF: ${{ inputs.source_ref || '' }}
      INPUT_OPTIONAL_PROFILES: ${{ inputs.optional_profiles || '' }}
      INPUT_REPLACE_DEFAULT_PROFILES: ${{ inputs.replace_default_optional_profiles || false }}
      INPUT_PACKAGE_OVERRIDES: ${{ inputs.package_overrides || '' }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true

      - name: Build environment setup
        run: |
          environment_script=/tmp/immortalwrt-init-build-environment.sh
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/immortalwrt/build-scripts/04a39ca00d2cd6895c84e1c0670bc719cbd8d9fb/init_build_environment.sh \
            --output "${environment_script}"
          echo "6b32b5b4667091aafb65240988831380818c6d8549f1ae45ee5249d93f26e3b7  ${environment_script}" | sha256sum --check
          sudo bash "${environment_script}"
          sudo -E apt -yqq install libfuse-dev ccache
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean

      - name: Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          root-reserve-mb: 1024
          temp-reserve-mb: 100
          swap-size-mb: 1024

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Restore download cache
        id: restore-download-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: cache/dl
          key: ax6600-dl-${{ runner.os }}-${{ hashFiles('feeds/custom.conf', 'targets/ax6600/manifest.yml', 'targets/ax6600/package-plan.yml', 'scripts/prepare_source_tree.sh') }}
          restore-keys: |
            ax6600-dl-${{ runner.os }}-

      - name: Restore compiler cache
        id: restore-ccache-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ax6600-ccache-${{ runner.os }}-${{ hashFiles('config/ax6600/**/*.config', 'feeds/custom.conf', 'targets/ax6600/manifest.yml', 'targets/ax6600/package-plan.yml', 'targets/ax6600/upstreams.yml', 'scripts/prepare_source_tree.sh', 'scripts/normalize_feed_versions.py', 'scripts/prune_conflicting_feed_packages.py') }}-${{ github.run_id }}
          restore-keys: |
            ax6600-ccache-${{ runner.os }}-${{ hashFiles('config/ax6600/**/*.config', 'feeds/custom.conf', 'targets/ax6600/manifest.yml', 'targets/ax6600/package-plan.yml', 'targets/ax6600/upstreams.yml', 'scripts/prepare_source_tree.sh', 'scripts/normalize_feed_versions.py', 'scripts/prune_conflicting_feed_packages.py') }}-
            ax6600-ccache-${{ runner.os }}-

      - name: Prepare compiler cache
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache --set-config=max_size="${CCACHE_MAXSIZE}"
          ccache --set-config=compiler_check="${CCACHE_COMPILERCHECK}"
          ccache --zero-stats || true

      - name: Install script dependencies
        run: python -m pip install --upgrade pip -r scripts/requirements.txt

      - name: Render runtime defaults overlay
        run: |
          python scripts/render_runtime_defaults.py \
            --manifest targets/ax6600/manifest.yml \
            --output build/ax6600/runtime-overlay/etc/uci-defaults/99-ax6600-defaults

      - name: Assemble config
        run: |
          EXTRA_ARGS=""
          if [ "${INPUT_REPLACE_DEFAULT_PROFILES}" = "true" ]; then
            EXTRA_ARGS="--replace-default-optional-profiles"
          fi
          python scripts/assemble_config.py \
            --manifest targets/ax6600/manifest.yml \
            --optional-profiles "${INPUT_OPTIONAL_PROFILES}" \
            --output build/ax6600/.config \
            ${EXTRA_ARGS}

      - name: Apply package overrides
        run: |
          python scripts/apply_package_overrides.py \
            --config build/ax6600/.config \
            --overrides="${INPUT_PACKAGE_OVERRIDES}"

      - name: Resolve source repository
        run: |
          python scripts/resolve_source.py \
            --source-key "${INPUT_SOURCE_KEY}" \
            --source-ref "${INPUT_SOURCE_REF}" \
            --output source.env
          cat source.env >> "$GITHUB_ENV"

      - name: Clone and prepare source tree
        run: |
          bash scripts/clone_source.sh "${SOURCE_REPO}" "${SOURCE_REF}" work/source
          echo "SOURCE_COMMIT=$(git -C work/source rev-parse HEAD)" >> "$GITHUB_ENV"
          bash scripts/prepare_source_tree.sh work/source feeds/custom.conf patches/firmware-layer build/ax6600/runtime-overlay
          mkdir -p "${GITHUB_WORKSPACE}/cache/dl"
          rm -rf work/source/dl
          ln -s "${GITHUB_WORKSPACE}/cache/dl" work/source/dl

      - name: Update feeds and defconfig
        run: |
          bash scripts/prepare_defconfig.sh \
            work/source \
            build/ax6600/.config \
            reports/feed-conflicts-build.md \
            reports/feed-patches-build.md \
            reports/feed-patches-build.json
          cp work/source/.config build/ax6600/final.config

      - name: Render defconfig focus report
        run: |
          python - <<'PY'
          from pathlib import Path

          config_path = Path("build/ax6600/final.config")
          lines = config_path.read_text(encoding="utf-8").splitlines()
          wanted = (
              "CONFIG_TARGET_qualcommax",
              "CONFIG_TARGET_qualcommax_ipq60xx",
              "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02",
              "CONFIG_TARGET_PROFILE",
              "CONFIG_TARGET_ROOTFS_INITRAMFS",
              "CONFIG_CCACHE",
              "CONFIG_ATH11K_NSS_SUPPORT",
              "CONFIG_PACKAGE_MAC80211_NSS_SUPPORT",
              "CONFIG_NSS_FIRMWARE_VERSION_11_4",
              "CONFIG_PACKAGE_libiconv-full",
              "CONFIG_PACKAGE_libintl-full",
              "CONFIG_PACKAGE_irqbalance",
              "CONFIG_PACKAGE_luci-app-irqbalance",
              "CONFIG_PACKAGE_ethtool",
              "CONFIG_PACKAGE_ethtool-full",
          )
          selected = []
          for line in lines:
              if line.startswith(wanted) or any(line.startswith(f"# {item} is not set") for item in wanted):
                  selected.append(line)
          report = "\n".join(
              [
                  "# Defconfig Focus Report",
                  "",
                  "```config",
                  *selected,
                  "```",
                  "",
              ]
          )
          report_path = Path("reports/defconfig-focus-build.md")
          report_path.parent.mkdir(parents=True, exist_ok=True)
          report_path.write_text(report, encoding="utf-8")
          print(report)
          PY

      - name: Validate required features
        run: |
          python scripts/check_required_features.py \
            --policy targets/ax6600/feature-policy.yml \
            --config build/ax6600/final.config \
            --output reports/required-features-build.md

      - name: Validate package plan after defconfig
        run: |
          EXTRA_ARGS=""
          if [ "${INPUT_REPLACE_DEFAULT_PROFILES}" = "true" ]; then
            EXTRA_ARGS="--replace-default-optional-profiles"
          fi
          python scripts/check_package_plan.py \
            --manifest targets/ax6600/manifest.yml \
            --package-plan targets/ax6600/package-plan.yml \
            --config build/ax6600/final.config \
            --optional-profiles "${INPUT_OPTIONAL_PROFILES}" \
            --package-overrides="${INPUT_PACKAGE_OVERRIDES}" \
            ${EXTRA_ARGS} \
            --output reports/package-plan-build.md

      - name: Upload defconfig debug snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ax6600-defconfig-${{ github.run_number }}
          path: |
            build/ax6600/.config
            build/ax6600/final.config
            reports/defconfig-focus-build.md
            reports/required-features-build.md
            reports/package-plan-build.md
            reports/feed-conflicts-build.md
            reports/feed-patches-build.md
            reports/feed-patches-build.json
          if-no-files-found: warn

      - name: Download sources
        run: |
          pushd work/source
          make download -j8
          popd

      - name: Save download cache
        if: always() && steps.restore-download-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: cache/dl
          key: ${{ steps.restore-download-cache.outputs.cache-primary-key }}

      - name: Build firmware
        run: |
          pushd work/source
          make -j"$(nproc)" || make -j1 V=s
          popd

      - name: Report compiler cache
        if: always()
        run: ccache -s || true

      - name: Save compiler cache
        if: success() && steps.restore-ccache-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ${{ steps.restore-ccache-cache.outputs.cache-primary-key }}

      - name: Verify embedded APK repository policy
        run: |
          runtime_script="$(find work/source/build_dir -type f -path '*/root-*/etc/uci-defaults/99-ax6600-defaults' -print -quit)"
          if [ -z "${runtime_script}" ]; then
            echo "Embedded AX6600 runtime defaults were not found in the built rootfs." >&2
            exit 1
          fi
          grep -F 'LOCAL_ONLY_FEEDS=' "${runtime_script}"
          grep -F '/etc/apk/repositories.d/distfeeds.list' "${runtime_script}"
          {
            echo "# APK Repository Policy"
            echo
            echo "- embedded runtime policy: ${runtime_script}"
            echo "- local-only custom feeds are disabled on first boot"
          } > reports/apk-repositories-build.md

      - name: Collect firmware artifacts
        run: |
          bash scripts/collect_firmware_artifacts.sh work/source dist/firmware
          python scripts/collect_build_provenance.py \
            --source-root work/source \
            --source-repo "${SOURCE_REPO}" \
            --source-branch "${SOURCE_BRANCH}" \
            --source-ref "${SOURCE_REF}" \
            --config build/ax6600/final.config \
            --patch-root patches/firmware-layer \
            --patch-report reports/feed-patches-build.json \
            --artifact-root dist/firmware \
            --output dist/release/build-provenance.json
          EXTRA_ARGS=""
          if [ "${INPUT_REPLACE_DEFAULT_PROFILES}" = "true" ]; then
            EXTRA_ARGS="--replace-default-optional-profiles"
          fi
          python scripts/render_release_metadata.py \
            --manifest targets/ax6600/manifest.yml \
            --compat targets/ax6600/compat-matrix.yml \
            --policy targets/ax6600/feature-policy.yml \
            --package-plan targets/ax6600/package-plan.yml \
            --source-repo "${SOURCE_REPO}" \
            --source-branch "${SOURCE_BRANCH}" \
            --source-ref "${SOURCE_REF}" \
            --source-commit "${SOURCE_COMMIT}" \
            --optional-profiles "${INPUT_OPTIONAL_PROFILES}" \
            --package-overrides="${INPUT_PACKAGE_OVERRIDES}" \
            --patch-set-version firmware-layer-v1 \
            --provenance dist/release/build-provenance.json \
            ${EXTRA_ARGS} \
            --output-json dist/release/release-metadata.json \
            --output-md dist/release/release-metadata.md

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ax6600-firmware-${{ github.run_number }}
          path: |
            dist/firmware/factory/**
            dist/firmware/sysupgrade/**
            dist/firmware/meta/**
            dist/release/release-metadata.json
            dist/release/release-metadata.md
            dist/release/build-provenance.json
            build/ax6600/final.config
            reports/required-features-build.md
            reports/package-plan-build.md
            reports/feed-conflicts-build.md
            reports/feed-patches-build.md
            reports/feed-patches-build.json
            reports/apk-repositories-build.md

      - name: Render build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Build AX6600 Firmware"
            echo ""
            echo "- Source: \`${SOURCE_REPO}@${SOURCE_BRANCH}\`"
            echo "- Release channel: \`stable\`"
            echo "- Default output: \`factory + sysupgrade\`"
            echo "- Release metadata: \`dist/release/release-metadata.md\`"
            echo "- Package-plan gate: \`reports/package-plan-build.md\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve release parameters
        if: startsWith(github.ref, 'refs/tags/ax6600-') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            release_tag="${GITHUB_REF_NAME}"
            release_name="${GITHUB_REF_NAME}"
            prerelease="false"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            shanghai_stamp="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
            short_sha="${GITHUB_SHA::7}"
            release_tag="ax6600-main-${shanghai_stamp}-run${GITHUB_RUN_NUMBER}-${short_sha}"
            release_name="AX6600 Main Prerelease ${shanghai_stamp} (${short_sha})"
            prerelease="true"
          else
            release_tag="${{ inputs.release_tag }}"
            release_name="${{ inputs.release_name }}"
            prerelease="${{ inputs.prerelease }}"
            if [[ -z "${release_tag}" ]]; then
              release_tag="ax6600-manual-${GITHUB_RUN_NUMBER}"
            fi
            if [[ -z "${release_name}" ]]; then
              release_name="${release_tag}"
            fi
          fi
          {
            echo "RELEASE_TAG=${release_tag}"
            echo "RELEASE_NAME=${release_name}"
            echo "RELEASE_PRERELEASE=${prerelease}"
          } >> "${GITHUB_ENV}"

      - name: Validate release eligibility
        if: startsWith(github.ref, 'refs/tags/ax6600-') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        run: |
          EXTRA_ARGS=""
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            EXTRA_ARGS="--prerelease"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            EXTRA_ARGS="--prerelease"
          fi
          python scripts/check_release_eligibility.py \
            --metadata dist/release/release-metadata.json \
            ${EXTRA_ARGS}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/ax6600-') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: dist/release/release-metadata.md
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          files: |
            dist/firmware/factory/**
            dist/firmware/sysupgrade/**
            dist/firmware/meta/**
            dist/release/release-metadata.json
            dist/release/release-metadata.md
            dist/release/build-provenance.json
            build/ax6600/final.config
            reports/required-features-build.md
            reports/package-plan-build.md
            reports/feed-patches-build.json
