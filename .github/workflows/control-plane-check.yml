name: Control Plane Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r scripts/requirements.txt

      - name: Parse YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = list(Path(".").rglob("*.yml")) + list(Path(".").rglob("*.yaml"))
          for file in files:
              yaml.safe_load(file.read_text(encoding="utf-8"))
          print(f"parsed {len(files)} yaml files")
          PY

      - name: Compile helper scripts and tests
        run: python -m compileall -q scripts tests

      - name: Run control-plane unit tests
        run: python -m unittest discover -s tests -v

      - name: Assemble baseline config
        run: |
          python scripts/assemble_config.py \
            --manifest targets/ax6600/manifest.yml \
            --output build/ax6600/.config

      - name: Render runtime defaults overlay
        run: |
          python scripts/render_runtime_defaults.py \
            --manifest targets/ax6600/manifest.yml \
            --output build/ax6600/runtime-overlay/etc/uci-defaults/99-ax6600-defaults

      - name: Apply sample package override
        run: |
          python scripts/apply_package_overrides.py \
            --config build/ax6600/.config \
            --overrides "luci-app-openclash zram-swap"

      - name: Validate required features
        run: |
          python scripts/check_required_features.py \
            --policy targets/ax6600/feature-policy.yml \
            --config build/ax6600/.config \
            --output reports/required-features-ci.md

      - name: Validate package plan
        run: |
          python scripts/check_package_plan.py \
            --manifest targets/ax6600/manifest.yml \
            --package-plan targets/ax6600/package-plan.yml \
            --config build/ax6600/.config \
            --config-phase assembled \
            --output reports/package-plan-ci.md

      - name: Validate baseline checker fixture
        run: |
          python scripts/check_baseline.py \
            --baseline benchmarks/baseline.yml \
            --metrics benchmarks/runtime-metrics.example.yml \
            --output reports/baseline-fixture-ci.md

      - name: Upload validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-plane-check
          path: |
            build/ax6600/.config
            build/ax6600/runtime-overlay/etc/uci-defaults/99-ax6600-defaults
            reports/required-features-ci.md
            reports/package-plan-ci.md
            reports/baseline-fixture-ci.md
